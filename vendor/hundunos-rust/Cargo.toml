[workspace]
members = [
    "tool-bridge",
    "policy-engine",
    "memory-graph",
    "model-router",
    "audiodit",
    "task-scientist",
    "bins/hundunos-core",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["HundunOS Team"]
license = "MIT"
description = "HundunOS Rust Core Modules v2.0 - edict-inspired architecture"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
dashmap = "5"
sha2 = "0.10"
regex = "1"
glob = "0.3"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = true

[profile.dev]
opt-level = 0
debug = true