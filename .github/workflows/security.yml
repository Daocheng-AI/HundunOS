name: 安全扫描

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ================================================================
  # SAST - 静态应用安全测试
  # ================================================================
  semgrep-sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行 Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/cwe-top-25
          args: '--verbose --json --output=semgrep-sast.json'
        env:
          SEMGREP_RULES: >-
            ruleid:javascript.security.insecure-random.insecure-random
            ruleid:javascript.security.detect-non-literal-fs-detect-non-literal-fs
            ruleid:javascript.lang.security.detect-eval-detect-eval

  # ================================================================
  # 依赖漏洞扫描
  # ================================================================
  dependency-scan:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 运行 npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 运行 Trivy 漏洞扫描
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'json'
          output: 'trivy-results.json'

  # ================================================================
  # 密钥检测
  # ================================================================
  secrets-scan:
    name: 密钥检测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 运行 Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG_PATH: .gitleaks.toml

  # ================================================================
  # 代码质量检查
  # ================================================================
  lint:
    name: 代码质量
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm ci

      - name: 运行 ESLint
        run: npm run lint || true

      - name: 运行 Prettier 检查
        run: npx prettier --check . || true

  # ================================================================
  # 生成安全报告
  # ================================================================
  security-report:
    name: 安全报告生成
    runs-on: ubuntu-latest
    needs: [semgrep-sast, dependency-scan, secrets-scan]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: 生成汇总报告
        run: |
          echo "# 安全扫描报告" > security-report.md
          echo "" >> security-report.md
          echo "扫描时间: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> security-report.md
          echo "" >> security-report.md
          
          # 检查各模块结果
          if [ -f semgrep-sast.json ]; then
            echo "## SAST 扫描" >> security-report.md
            echo "结果: Semgrep 扫描完成" >> security-report.md
            echo "" >> security-report.md
          fi
          
          if [ -f trivy-results.json ]; then
            echo "## 依赖漏洞扫描" >> security-report.md
            echo "结果: Trivy 扫描完成" >> security-report.md
            echo "" >> security-report.md
          fi
          
          cat security-report.md

      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md
          retention-days: 30