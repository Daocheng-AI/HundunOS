# hundunos/kernel/skills/skills/github.yaml
# HundunOS v3.8 — GitHub Skill
# 触发：github, issue, pull request, PR, github action, release, repo
# 功能：Issues 管理 / PR 操作 / Actions 查看 / Releases

name: github
version: 1.0.0
description: GitHub Issues、PR、Actions、Releases 完整管理

# 触发条件
trigger:
  patterns:
    - github
    - issue
    - pull request
    - pull_request
    - PR
    - github action
    - release
    - repo
    - starred
    - repository
  semantic: true

# 工具集
tools:
  - id: github_list_issues
    type: http
    description: 列出仓库 Issues
    endpoint: https://api.github.com/repos/{{owner}}/{{repo}}/issues
    method: GET
    auth: env.GITHUB_TOKEN
    headers:
      Accept: application/vnd.github.v3+json
      X-GitHub-Api-Version: "2022-11-28"

  - id: github_create_issue
    type: http
    description: 创建 Issue
    endpoint: https://api.github.com/repos/{{owner}}/{{repo}}/issues
    method: POST
    auth: env.GITHUB_TOKEN
    headers:
      Accept: application/vnd.github.v3+json
    body_template: |
      {
        "title": "{{title}}",
        "body": "{{body}}",
        "labels": {{labels | json}},
        "assignees": {{assignees | json | default: "[]"}}
      }

  - id: github_get_pr
    type: http
    description: 获取 Pull Request 详情
    endpoint: https://api.github.com/repos/{{owner}}/{{repo}}/pulls/{{number}}
    method: GET
    auth: env.GITHUB_TOKEN
    headers:
      Accept: application/vnd.github.v3+json

  - id: github_list_actions
    type: http
    description: 列出最近 Actions 运行
    endpoint: https://api.github.com/repos/{{owner}}/{{repo}}/actions/runs
    method: GET
    auth: env.GITHUB_TOKEN
    headers:
      Accept: application/vnd.github.v3+json

  - id: github_create_release
    type: http
    description: 创建 Release
    endpoint: https://api.github.com/repos/{{owner}}/{{repo}}/releases
    method: POST
    auth: env.GITHUB_TOKEN
    headers:
      Accept: application/vnd.github.v3+json
    body_template: |
      {
        "tag_name": "{{tag_name}}",
        "name": "{{name}}",
        "body": "{{body}}",
        "draft": {{draft | default: false}},
        "prerelease": {{prerelease | default: false}}
      }

# System Prompt 注入
system_prompt: |
  你是一个专业的 GitHub 助手。当用户提到 GitHub 相关任务时：
  - 优先使用 GitHub REST API v3（https://docs.github.com/en/rest）
  - Issues 用于任务追踪，使用 labels 进行分类
  - Pull Requests 用于代码审查，确保 title 和 body 清晰
  - Actions 用于 CI/CD 自动化（查看失败原因优先）
  - Releases 用于版本发布，确保 Changelog 完整
  - 所有 API 调用需要 owner/repo 参数，请从对话中提取或询问用户

# 执行配置
execution:
  isolation: none      # HTTP 工具不需要隔离
  timeout: 30000       # 30s 超时
  retry: 3             # 重试 3 次

# 示例
examples:
  - input: "帮我看看这个仓库最近有哪些 open issues"
    output: 调用 github_list_issues，筛选 state=open
  - input: "为 hundunos 项目创建一个 v1.0.0 release"
    output: 调用 github_create_release，tag=v1.0.0
