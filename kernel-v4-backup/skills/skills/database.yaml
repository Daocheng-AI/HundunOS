# hundunos/kernel/skills/skills/database.yaml
# HundunOS v3.8 — Database Skill
# 触发：sql, 数据库, migration, schema, 表结构, query, postgres, mysql
# 功能：SQL 查询 / 迁移生成 / Schema 分析

name: database
version: 1.0.0
description: 数据库操作（SQL 查询、Migration 编写、Schema 分析）

trigger:
  patterns:
    - sql
    - 数据库
    - migration
    - migrate
    - schema
    - 表结构
    - query
    - postgres
    - mysql
    - sqlite
    - redis
    - 索引
    - 迁移
    - select
    - insert
    - update
  semantic: true

tools:
  - id: db_query
    type: function
    description: 执行只读 SQL 查询
    fn: |
      async (params) => {
        // 占位：实际由 kernel/database-adapter.js 提供实现
        // 这里返回模板化的查询语句供用户确认执行
        return {
          sql: params.sql,
          estimated_rows: null,
          warning: '请确认后执行，危险操作会被审计'
        };
      }

  - id: db_generate_migration
    type: function
    description: 生成数据库 Migration 文件
    fn: |
      async (params) => {
        const { table, columns, action = 'create' } = params;
        const lines = [
          `--- ${new Date().toISOString().slice(0,10)}`,
          `--- Migration: ${action} table ${table}`,
          '',
          `exports.up = async (knex) => {`,
          `  await knex.schema.${action}Table('${table}', (table) => {`,
          ...(columns || []).map(col => `    table.${col.type}('${col.name}'${col.args ? `, ${JSON.stringify(col.args)}` : ''})`),
          `  })`,
          `};`,
          '',
          `exports.down = async (knex) => {`,
          `  await knex.schema.${action === 'create' ? 'dropTable' : 'createTable'}IfNotExists('${table}')`,
          `};`,
        ];
        return { migration: lines.join('\n'), filename: `${Date.now()}_${action}_${table}.js` };
      }

  - id: db_explain
    type: function
    description: SQL 执行计划分析
    fn: |
      async (params) => {
        // 生成 EXPLAIN 输出（模拟）
        return {
          sql: params.sql,
          plan: '[使用对应数据库的 EXPLAIN 关键字分析]',
          suggestions: [
            '检查是否有合适的索引',
            '避免 SELECT *，指定需要的列',
            '大表分页使用游标而非 OFFSET',
          ]
        };
      }

system_prompt: |
  你是一个数据库专家。当用户提到数据库、SQL、Migration 相关任务时：
  - 所有写操作（INSERT/UPDATE/DELETE/DROP）必须确认后才能执行
  - 优先使用参数化查询防止 SQL 注入
  - Migration 文件必须包含 up() 和 down() 两个方向
  - 索引设计考虑：查询频率、写入比例、联合索引顺序
  - 建议使用 knex.js / prisma 等 ORM 语法生成 Migration

execution:
  isolation: process
  timeout: 15000
  retry: 1

examples:
  - input: "生成一个 users 表的 migration"
    output: 调用 db_generate_migration，columns=[id, name, email, created_at]
  - input: "分析这条 SQL 的性能"
    output: 调用 db_explain，提供优化建议
