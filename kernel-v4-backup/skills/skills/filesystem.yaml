# hundunos/kernel/skills/skills/filesystem.yaml
# HundunOS v4.1 Skill: 跨平台文件系统操作助手
# v4.1: 增强 Windows 支持（PowerShell 命令）
# 触发：文件查找、目录列表、搜索、统计、对比

name: filesystem
version: 1.1.0
description: 跨平台文件浏览、搜索、统计、比较助手（支持 Windows/macOS/Linux）
author: hundunos-core
tags:
  - filesystem
  - files
  - directory
  - search
  - find
  - diff
  - stats
  - workspace

# 触发条件
trigger:
  patterns:
    - find file
    - list directory
    - search files
    - file stats
    - disk usage
    - file diff
    - directory tree
    - find in files
    - grep
    - locate
    - 文件查找
    - 目录列表
    - 列出文件
    - 搜索文件
  semantic: true

# Skill 工具（优先使用 Unix 命令，Windows 降级到 PowerShell）
tools:
  # ── 目录浏览 ──────────────────────────────────────
  - id: fs_list_dir
    type: shell
    # Unix: ls -la  | Windows: dir /a
    command: if (Test-Path "{{path | default '.'}}") { Get-ChildItem -Force "{{path | default '.'}}" | Format-Table Name, Length, LastWriteTime -AutoSize | Out-String -Width 200 } else { Write-Error "目录不存在: {{path}}" }
    description: 列出目录内容（包含隐藏文件，跨平台）
    isolation: process
    timeout: 15000

  - id: fs_tree
    type: shell
    # Unix: find | Windows: Get-ChildItem -Recurse
    command: Get-ChildItem -Path "{{path | default '.'}}" -Depth {{depth | default 2}} -Force | ForEach-Object { "$('  ' * $_.PSParentPath.Split('\').Count) $($_.Name)" } | Select-Object -First 60
    description: 目录树结构（限制60项，跨平台）
    isolation: process
    timeout: 20000

  # ── 文件查找 ──────────────────────────────────────
  - id: fs_find_by_name
    type: shell
    # Unix: find -name | Windows: Get-ChildItem -Recurse -Filter
    command: Get-ChildItem -Path "{{path | default '.'}}" -Recurse -Force -Filter "{{pattern}}" -ErrorAction SilentlyContinue | Select-Object -First 30 FullName, Length, LastWriteTime | Format-Table -AutoSize | Out-String -Width 200
    description: 按名称/通配符查找文件
    isolation: process
    timeout: 30000

  - id: fs_find_by_content
    type: shell
    # Unix: grep -rn | Windows: Select-String
    command: Get-ChildItem -Path "{{path | default '.'}}" -Recurse -Force -File -ErrorAction SilentlyContinue | Select-String -Pattern "{{pattern}}" -SimpleMatch -List | Select-Object -First 30 Path, LineNumber | Format-Table -AutoSize | Out-String -Width 200
    description: 按内容搜索文件（跨平台 grep）
    isolation: process
    timeout: 60000

  # ── 统计分析 ──────────────────────────────────────
  - id: fs_file_stats
    type: shell
    command: if (Test-Path "{{path}}") { Get-Item "{{path}}" | Select-Object FullName, Length, LastWriteTime, CreationTime, Attributes | Format-List } else { Write-Error "路径不存在: {{path}}" }
    description: 文件/目录详细信息
    isolation: process
    timeout: 10000

  - id: fs_file_count
    type: shell
    command: $f=(Get-ChildItem -Path "{{path | default '.'}}" -Recurse -Force -File -ErrorAction SilentlyContinue).Count; $d=(Get-ChildItem -Path "{{path | default '.'}}" -Recurse -Force -Directory -ErrorAction SilentlyContinue).Count; Write-Output "文件数: $f`n目录数: $d"
    description: 统计文件/目录数量
    isolation: process
    timeout: 30000

  - id: fs_size_analysis
    type: shell
    command: Get-ChildItem -Path "{{path | default '.'}}" -Force -ErrorAction SilentlyContinue | Where-Object { !$_.PSIsContainer } | Measure-Object -Property Length -Sum | Select-Object @{N='Path';E={'{{path}}'}, @{N='TotalSize_MB';E={[math]::Round($_.Sum/1MB,2)}}, Count | Format-Table -AutoSize | Out-String -Width 200
    description: 目录大小分析（MB）
    isolation: process
    timeout: 20000

  - id: fs_file_type_count
    type: shell
    command: Get-ChildItem -Path "{{path | default '.'}}" -Recurse -Force -File -ErrorAction SilentlyContinue | ForEach-Object { $_.Extension } | Group-Object | Sort-Object Count -Descending | Select-Object -First 15 Count, Name | Format-Table -AutoSize | Out-String -Width 100
    description: 按扩展名统计文件数量 Top 15
    isolation: process
    timeout: 30000

  # ── 文件比较 ──────────────────────────────────────
  - id: fs_compare_files
    type: shell
    command: Compare-Object (Get-Content "{{file1}}" -Raw -ErrorAction SilentlyContinue) (Get-Content "{{file2}}" -Raw -ErrorAction SilentlyContinue) -PassThru | Select-Object -First 30 | Format-Table -AutoSize | Out-String -Width 200
    description: 比较两个文件差异
    isolation: process
    timeout: 20000

  - id: fs_newest_files
    type: shell
    command: Get-ChildItem -Path "{{path | default '.'}}" -Recurse -Force -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 20 FullName, LastWriteTime | Format-Table -AutoSize | Out-String -Width 200
    description: 查找最近修改的文件 Top 20
    isolation: process
    timeout: 30000

  # ── 搜索增强（快速） ───────────────────────────────
  - id: fs_search_code
    type: shell
    command: Get-ChildItem -Path "{{path | default '.'}}" -Recurse -Force -Include {{include | default '*'}} -File -ErrorAction SilentlyContinue | Select-String -Pattern "{{pattern}}" -SimpleMatch -List | Select-Object -First {{limit | default 20}} Path | Format-Table -AutoSize | Out-String -Width 200
    description: 按扩展名过滤内容搜索
    isolation: process
    timeout: 60000

  # ── 大文件检测 ─────────────────────────────────────
  - id: fs_large_files
    type: shell
    command: Get-ChildItem -Path "{{path | default '.'}}" -Recurse -Force -File -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt {{minSizeMB | default 10}}MB } | Sort-Object Length -Descending | Select-Object -First 15 FullName, @{N='Size_MB';E={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize | Out-String -Width 200
    description: 查找超过指定大小的文件（默认>10MB）
    isolation: process
    timeout: 60000

# 执行配置
execution:
  isolation: process
  timeout: 60000
  retry: 1

# System prompt 注入
system_prompt: |
  ## 跨平台文件系统助手模式（v4.1）

  你是一个跨平台文件系统操作助手，支持 Windows（PowerShell）、macOS/Linux（Unix）。

  **常用操作（按场景推荐）：**
  - 浏览目录 → `fs_list_dir`（path 参数，默认当前目录 `.`）
  - 目录树 → `fs_tree`（path, depth 参数，默认深度 2）
  - 按名查找 → `fs_find_by_name`（path, pattern 支持通配符 `*.js`）
  - 内容搜索 → `fs_find_by_content`（path, pattern，支持中文）
  - 文件统计 → `fs_file_stats`（path，完整元信息）
  - 数量统计 → `fs_file_count`（path，文件+目录数）
  - 大小分析 → `fs_size_analysis`（path，MB 为单位）
  - 扩展名统计 → `fs_file_type_count`（path，Top 15）
  - 文件对比 → `fs_compare_files`（file1, file2）
  - 最近修改 → `fs_newest_files`（path，默认 Top 20）
  - 代码搜索 → `fs_search_code`（path, pattern, include="*.js,*.ts"）
  - 大文件检测 → `fs_large_files`（path, minSizeMB=10）

  **跨平台说明：**
  - 所有命令已适配 Windows PowerShell（优先）
  - Unix 环境会自动使用 `find`/`grep`/`stat` 等命令

  **安全原则：**
  - 不要修改或删除找到的文件
  - 大型目录使用 `depth` 参数限制深度
  - 默认跳过 `.git`、`node_modules` 等缓存目录
  - 优先使用汇总而非逐条列出
