# kernel/skills/skills/minimax-docx.yaml
# HundunOS v4.1 — Word/DOCX 文档生成 Skill（高级，需要 .NET）
# 移植自 MiniMax-AI/skills (MIT License)
# .NET OpenXML SDK · 13 种美学配方 · XSD 验证门控 · C# 编译模式

name: minimax-docx
version: 1.0.0
description: >
  专业级 Word/DOCX 文档生成引擎（高级 Skill，需要 .NET 环境）。
  支持 CREATE（从模板/零创建）、FILL-EDIT（表单编辑+内容修改）、
  FORMAT-APPLY（美学配方应用）。基于 .NET OpenXML SDK，
  提供 13 种学术/出版级美学配方（IEEE/ACM/APA/Nature/HBR 等）。
  **前置条件**: 需要 .NET 8+ SDK 和 dotnet CLI。
author: minimax-ai / hundunos-port
license: MIT
tags:
  - docx
  - word
  - document
  - academic
  - openxml

trigger:
  patterns:
    - create Word document
    - generate DOCX
    - write paper
    - academic paper
    - format Word doc
    - apply template DOCX
    - 创建 Word 文档
    - 写论文
    - 学术论文
    - 格式化 Word
  semantic: true

tools:
  # ── SETUP: 环境初始化 ──────────────────────────────────
  - id: docx_setup
    type: shell
    command: powershell -ExecutionPolicy Bypass -File "{{skill_dir}}scripts/setup.ps1"
    description: 检查 .NET 环境并编译 OpenXML 工具链
    isolation: process
    timeout: 120000

  # ── CREATE: 创建文档 ───────────────────────────────────
  - id: docx_create
    type: shell
    command: dotnet run --project "{{skill_dir}}scripts/dotnet/MiniMaxAIDocx.Cli" -- create --output "{{out | default 'output.docx'}}" --title "{{title}}" --author "{{author | default 'HundunOS'}}" --recipe "{{recipe | default 'ieee'}}" --content "{{content | default ''}}"
    description: >
      使用指定美学配方创建新 DOCX 文档。
      配方: ieee, acm, apa, nature, hbr, gb-t9704, modern, classic,
      minimal, editorial, technical, legal, creative
    isolation: process
    timeout: 60000

  # ── EDIT: 编辑文档 ─────────────────────────────────────
  - id: docx_edit
    type: shell
    command: dotnet run --project "{{skill_dir}}scripts/dotnet/MiniMaxAIDocx.Cli" -- edit --input "{{input}}" --out "{{out | default 'edited.docx'}}" --changes '{{changes | default "{}"}}'
    description: 编辑现有 DOCX：替换文本、修改格式、插入段落
    isolation: process
    timeout: 60000

  # ── APPLY-TEMPLATE: 应用美学配方 ──────────────────────
  - id: docx_apply_template
    type: shell
    command: dotnet run --project "{{skill_dir}}scripts/dotnet/MiniMaxAIDocx.Cli" -- apply-template --input "{{input}}" --out "{{out | default 'formatted.docx'}}" --recipe "{{recipe | default 'ieee'}}"
    description: 对已有文档应用指定的美学配方（字体/间距/标题样式）
    isolation: process
    timeout: 60000

  # ── VALIDATE: 验证文档 ─────────────────────────────────
  - id: docx_validate
    type: shell
    command: dotnet run --project "{{skill_dir}}scripts/dotnet/MiniMaxAIDocx.Cli" -- validate --input "{{input}}"
    description: 使用 XSD Schema 验证文档结构完整性
    isolation: process
    timeout: 30000

  # ── CHECK: 环境检查 ─────────────────────────────────────
  - id: docx_check_env
    type: shell
    command: dotnet --version 2>&1; Write-Output "---"; dotnet build "{{skill_dir}}scripts/dotnet/MiniMaxAIDocx.slnx" --no-restore 2>&1 | Select-Object -Last 5
    description: 检查 .NET SDK 和项目是否可编译
    isolation: process
    timeout: 30000

execution:
  isolation: process
  timeout: 120000
  retry: 1
  skill_dir: extension-modules/minimax-docx/
  requires_dotnet: true

system_prompt: |
  ## minimax-docx 专业 Word 文档处理模式（v1.0）【高级 Skill】

  你是一个**专业文档排版专家**，精通 Word/OpenXML 格式和学术出版规范。

  ### ⚠️ 前置条件

  此 Skill 需要 **.NET 8+ SDK**。使用前必须：
  1. 调用 `docx_setup` 初始化环境（编译 C# 项目）
  2. 或调用 `docx_check_env` 验证环境可用性

  如果用户没有 .NET 环境，建议改用 minimax-pdf (PDF) 或其他替代方案。

  ### 三条管线

  **CREATE** — 新建文档：
  ```
  docx_create(title="论文标题", author="作者", recipe="ieee", content="...")
  ```

  **FILL-EDIT** — 编辑已有文档：
  ```
  docx_edit(input="source.docx", changes='{"replace":{"old":"new"}}')
  ```

  **FORMAT-APPLY** — 应用美学配方：
  ```
  docx_apply_template(input="draft.docx", recipe="nature")
  ```

  ### 美学配方（13种）

  | 配方 | 适用场景 | 特征 |
  |------|---------|------|
  | `ieee` | 工程/技术论文 | IEEE 标准双栏、衬线正文 |
  | `acm` | 计算机科学 | ACM SIGCHI 单栏、无衬线标题 |
  | `apa` | 社会科学/心理 | APA 第七版、Times New Roman |
  | `nature` | 自然科学 | Nature 风格、紧凑排版 |
  | `hbr` | 商业管理报告 | Harvard Business Review 风格 |
  | `gb-t9704` | 中国国标论文 | GB/T 9704-2012 国家标准 |
  | `modern` | 现代/科技文档 | 无衬线字体、大量留白 |
  | `classic` | 经典正式文档 | Garamond 衬线、传统边距 |
  | `minimal` | 极简风格 | 最小格式干扰 |
  | `editorial` | 编辑/杂志文章 | 杂志式标题层级 |
  | `technical` | 技术手册 | 固定宽度等宽代码块 |
  | `legal` | 法律文件 | 双倍行距、编号段落 |
  | `creative` | 创意写作 | 自由排版、装饰元素 |

  ### 可用命令（CLI）

  ```bash
  # 创建
  dotnet run --project ... -- create --output paper.docx --title "Title" --recipe ieee

  # 编辑
  dotnet run --project ... -- edit --input draft.docx --out fixed.docx

  # 应用模板
  dotnet run --project ... -- apply-template --input raw.docx --out formatted.docx --recipe nature

  # 验证
  dotnet run --project ... -- validate --input final.docx

  # 合并连续运行（MergeRuns）
  dotnet run --project ... -- merge-runs --input messy.docx --out clean.docx

  # 分析文档结构
  dotnet run --project ... -- analyze --input sample.docx

  # Diff 对比
  dotnet run --project ... -- diff --original v1.docx --revised v2.docx
  ```

  ### 注意事项

  - 首次使用需运行 `setup.ps1` 还原 NuGet 包并编译
  - 所有输出均为标准 OOXML (.docx) 格式，兼容 Microsoft Word / LibreOffice / WPS
  - 配方应用是幂等操作（可重复执行）
