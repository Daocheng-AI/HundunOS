# hundunos/kernel/skills/skills/git.yaml
# HundunOS Phase 2 Skill: Git 版本控制助手

name: git
version: 1.0.0
description: Git 仓库状态、分支、历史、提交管理助手
author: hundunos-core
tags:
  - git
  - version-control
  - commit
  - branch
  - merge
  - stash
  - log
  - diff
  - repository

# 触发条件
trigger:
  patterns:
    - git commit
    - git branch
    - git status
    - git log
    - git diff
    - git merge
    - git stash
    - git checkout
    - git push
    - git pull
    - git fetch
    - git rebase
    - git reset
    - 版本控制
    - 代码提交
    - 分支管理
  semantic: true

# Skill 工具
tools:
  - id: git_status
    type: shell
    command: git -C "{{path | default '.'}}" status --short
    description: 简短状态（彩色输出）

  - id: git_branch_list
    type: shell
    command: git -C "{{path | default '.'}}" branch -vv
    description: 列出所有分支及追踪关系

  - id: git_current_branch
    type: shell
    command: git -C "{{path | default '.'}}" branch --show-current
    description: 当前分支名

  - id: git_log_graph
    type: shell
    command: git -C "{{path | default '.'}}" log --oneline --graph --all -n {{count | default 20}}
    description: 提交历史图形化（Top N）

  - id: git_diff_staged
    type: shell
    command: git -C "{{path | default '.'}}" diff --cached
    description: 已暂存的变更

  - id: git_diff_workdir
    type: shell
    command: git -C "{{path | default '.'}}" diff
    description: 工作区变更（未暂存）

  - id: git_diff_branch
    type: shell
    command: git -C "{{path | default '.'}}" log "{{from | default 'HEAD~5'}}..{{to | default 'HEAD'}}" --oneline
    description: 两分支/提交之间的差异

  - id: git_stash_list
    type: shell
    command: git -C "{{path | default '.'}}" stash list
    description: 列出所有 stash

  - id: git_remote_list
    type: shell
    command: git -C "{{path | default '.'}}" remote -v
    description: 列出远程仓库

  - id: git_tag_list
    type: shell
    command: git -C "{{path | default '.'}}" tag -l --sort=-v:refname | head -20
    description: 列出标签（最近20个）

  - id: git_conflict_count
    type: shell
    command: grep -r "<<<<<<" "{{path | default '.'}}" --include="*.js" --include="*.ts" --include="*.py" -l 2>/dev/null | wc -l
    description: 统计合并冲突文件数量

  - id: git_repo_info
    type: shell
    command: git -C "{{path | default '.'}}" remote get-url origin 2>/dev/null && git -C "{{path | default '.'}}" rev-parse HEAD && git -C "{{path | default '.'}}" describe --tags --always
    description: 仓库基本信息（远程/HEAD/tag）

# 执行配置
execution:
  isolation: process
  timeout: 15000
  retry: 1

# System prompt 注入
system_prompt: |
  ## Git 版本控制助手模式

  你是一个 Git 版本控制助手。执行查看、分析类任务为主。

  **常用操作：**
  - 状态：`git_status`（path）
  - 分支列表：`git_branch_list`（path）
  - 当前分支：`git_current_branch`（path）
  - 提交历史：`git_log_graph`（path, count）
  - 暂存区差异：`git_diff_staged`（path）
  - 工作区差异：`git_diff_workdir`（path）
  - 分支间差异：`git_diff_branch`（path, from, to）
  - Stash 列表：`git_stash_list`（path）
  - 远程仓库：`git_remote_list`（path）
  - 标签列表：`git_tag_list`（path）
  - 冲突统计：`git_conflict_count`（path）
  - 仓库信息：`git_repo_info`（path）

  **安全原则：**
  - 写入操作（commit/push/merge/reset）需要用户明确授权
  - 不执行 `git push --force`（除非用户明确要求并确认）
  - 查看冲突文件时只读分析，不自动解决
  - 查看 stash 时注意不要 pop（只 stash pop 需要授权）

  **分支策略参考：**
  - main/master: 稳定发布分支
  - develop: 开发主分支
  - feature/: 新功能
  - bugfix/: Bug 修复
  - hotfix/: 紧急热修复
