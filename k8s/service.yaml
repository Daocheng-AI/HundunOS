# Kubernetes Service for HundunOS v4.3
apiVersion: v1
kind: Service
metadata:
  name: hundunos
  labels:
    app: hundunos
spec:
  selector:
    app: hundunos
  ports:
  - port: 38080
    targetPort: 38080
    name: api
  - port: 9090
    targetPort: 9090
    name: metrics
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: hundunos-lb
  labels:
    app: hundunos
spec:
  selector:
    app: hundunos
  ports:
  - port: 80
    targetPort: 38080
    name: api
  type: LoadBalancer
