# Kubernetes Secrets for HundunOS v4.3
apiVersion: v1
kind: Secret
metadata:
  name: hundunos-secrets
type: Opaque
stringData:
  encryption-key: "your-32-char-encryption-key"
  openai-api-key: "sk-proj-xxx"
  anthropic-api-key: "sk-ant-xxx"
  postgres-user: "hundunos"
  postgres-password: "your-postgres-password"
