# Prometheus 监控配置
# HundunOS 指标采集配置
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'hundunos'
    environment: 'production'

# 告警规则
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# 规则文件
rule_files:
  - "alert_rules.yml"

# 抓取目标
scrape_configs:
  # HundunOS 应用指标
  - job_name: 'hundunos'
    static_configs:
      - targets: ['hundunos:38080']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Nginx 指标（需开启 stub_status）
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    metrics_path: '/metrics'
    params:
      module: ['http_stub_status_modules']

  # Redis 指标
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # Ollama 指标
  - job_name: 'ollama'
    static_configs:
      - targets: ['ollama:11434']
