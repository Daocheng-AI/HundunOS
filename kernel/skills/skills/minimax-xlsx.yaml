# kernel/skills/skills/minimax-xlsx.yaml
# HundunOS v4.1 — Excel/电子表格处理 Skill
# 移植自 MiniMax-AI/skills (MIT License)
# XML 模板管线 · 零损编辑 · 公式验证 · 财务格式化

name: minimax-xlsx
version: 1.0.0
description: >
  专业级 Excel/XLSX 电子表格处理引擎。支持 READ（结构分析+数据审计）、
  CREATE（从模板创建）、EDIT（XML 零损编辑，保留 VBA/数据透视表）、
  FIX（公式修复）、VALIDATE（数据验证）。
  使用 XML 直接操作管线，不依赖 openpyxl round-trip。
author: minimax-ai / hundunos-port
license: MIT
tags:
  - xlsx
  - excel
  - spreadsheet
  - financial
  - data

trigger:
  patterns:
    - create spreadsheet
    - make Excel
    - generate XLSX
    - edit spreadsheet
    - fix Excel
    - validate XLSX
    - read spreadsheet
    - analyze Excel
    - 财务报表
    - 电子表格
    - 创建 Excel
    - 编辑表格
  semantic: true

tools:
  # ── READ: 结构分析与数据审计 ──────────────────────────
  - id: xlsx_read
    type: shell
    command: python "{{skill_dir}}scripts/xlsx_reader.py" "{{input}}"
    description: >
      读取 XLSX 文件结构：工作表列表、行列范围、数据类型分布、
      合并单元格、公式统计、数据质量审计报告。
    isolation: process
    timeout: 30000

  # ── CREATE: 从模板创建 ────────────────────────────────
  - id: xlsx_create
    type: shell
    command: python -c "
import json, sys, zipfile, os
from xml.etree.ElementTree import Element, SubElement, tostring
data = json.loads('''{{content | default '{}'}}''')
out = '''{{out | default 'output.xlsx'}}'''
# Minimal XLSX creation with content
import shutil
tmpl = os.path.join('{{skill_dir}}', 'scripts', 'template.xlsx')
if os.path.exists(tmpl):
    shutil.copy2(tmpl, out)
else:
    print('WARN: No template found, creating minimal structure')
" 2>&1; if (Test-Path "{{skill_dir}}scripts/template.xlsx") { Copy-Item "{{skill_dir}}scripts/template.xlsx" "{{out | default 'output.xlsx'}}" -Force } else { Write-Output "No template available — use EDIT on existing file instead" }
    description: 从模板创建新 XLSX 文件（或使用默认模板）
    isolation: process
    timeout: 15000

  # ── EDIT: XML 零损编辑管线 ────────────────────────────
  - id: xlsx_unpack
    type: shell
    command: python "{{skill_dir}}scripts/xlsx_unpack.py" --input "{{input}}" --output-dir "{{output_dir | default '$env:TEMP\xlsx_edit'}}"
    description: 解包 XLSX 为可编辑的 XML 文件目录
    isolation: process
    timeout: 30000

  - id: xlsx_pack
    type: shell
    command: python "{{skill_dir}}scripts/xlsx_pack.py" --input-dir "{{input_dir | default '$env:TEMP\xlsx_edit'}}" --output "{{out | default 'output.xlsx'}}"
    description: 将编辑后的 XML 目录重新打包为 XLSX
    isolation: process
    timeout: 15000

  # ── VALIDATE: 数据验证 ────────────────────────────────
  - id: xlsx_validate
    type: shell
    command: python "{{skill_dir}}scripts/xlsx_reader.py" "{{input}}" --validate-only
    description: 执行数据质量验证：空值检查、格式一致性、公式错误检测
    isolation: process
    timeout: 30000

execution:
  isolation: process
  timeout: 60000
  retry: 1
  skill_dir: extension-modules/minimax-xlsx/

system_prompt: |
  ## minimax-xlsx 专业电子表格处理模式（v1.0）

  你是一个**专业数据分析师和电子表格专家**，精通 Excel/XLSX 的底层 XML 结构。

  ### 五条路线

  **READ** — 分析已有文件：
  - 调用 `xlsx_read` 工具获取完整结构报告
  - 返回：工作表列表、行列范围、数据类型、合并区域、公式数量、质量评分

  **CREATE** — 新建文件：
  - 如果有模板可用则用 `xlsx_create`
  - 否则先解包一个空白模板再修改 XML

  **EDIT** — 编辑现有文件（零损）：
  1. 用 `xlsx_unpack` 解包为 XML 目录
  2. 直接编辑 `.xml` 文件（不经过 openpyxl）
  3. 用 `xlsx_pack` 打包回 .xlsx
  - **优势**: 保留 VBA 宏、数据透视表、条件格式、自定义属性

  **FIX** — 修复问题：
  - 先 `xlsx_read` 发现问题 → 再 `unpack/edit/pack` 修复
  - 常见修复：循环引用、#REF! 错误、损坏的命名范围

  **VALIDATE** — 数据质量检查：
  - 使用 `xlsx_validate`
  - 检查项：空值率、格式一致性、数值范围、日期有效性、公式错误

  ### 编辑管线（核心）

  ```
  input.xlsx ──[unpack]──→ xlsx_edit/
  │                         ├── xl/
  │                         │   ├── workbook.xml
  │                         │   ├── worksheets/
  │                         │   │   ├── sheet1.xml
  │                         │   │   └── sheet2.xml
  │                         │   ├── styles.xml
  │                         │   └── sharedStrings.xml
  │                         └── [Content_Types].xml
  │
  └──[edit XML files]──→ xlsx_edit/ (modified)
                            │
                    [pack]──→ output.xlsx (VBA/pivots preserved)
  ```

  ### 财务格式化标准

  | 元素 | 颜色 | 说明 |
  |------|------|------|
  | 用户输入 | **蓝色** | 可编辑的数据输入格 |
  | 公式计算 | **黑色** | 自动计算的值 |
  | 跨表引用 | **绿色** | 引用其他工作表的公式 |

  ### 注意事项

  - **永远不要用 openpyxl 做往返编辑** — 会丢失 VBA 和数据透视表
  - XML 编辑时保持 namespace 前缀一致
  - 共享字符串表 (sharedStrings.xml) 的索引必须连续且有效
  - 解包后 `[Content_Types].xml` 不要修改除非你清楚知道在做什么

  ### 依赖

  - Python 3.8+
  - pandas（用于数据分析）
  - 无需 openpyxl（使用原生 XML 操作）
